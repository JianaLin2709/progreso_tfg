<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Hanzi Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=1">
</head>
<body class="auth-page" data-auth-mode="registro">
  <main class="auth-shell form-only">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <span class="auth-eyebrow">TU CAMINO EMPIEZA AQUÍ</span>
        <h2 id="auth-title">Crear una cuenta</h2>
        <p>Crea tu cuenta para acceder a nuestros super contenidos.</p>

        <form id="auth-form" novalidate>
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" minlength="2" maxlength="50" required placeholder="Cómo quieres que te llamemos">

          <label for="email">Alias de usuario</label>
          <input id="email" name="email" type="text" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9._-]+@learncn\.na" required placeholder="nombre@learncn.na" aria-describedby="alias-help">
          <small id="alias-help">Utiliza el formato nombre@learncn.na</small>

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Mínimo 8 caracteres">

          <label for="password-confirmation">Repite la contraseña</label>
          <input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Repite la contraseña">

          <p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p>
          <button class="auth-submit" type="submit">Crear cuenta <span aria-hidden="true">→</span></button>
        </form>

        <p class="auth-switch">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        <a class="auth-back" href="acceso.html">← Volver</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/auth-form.js?v=2"></script>
</body>
</html>
